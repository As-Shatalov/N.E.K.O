name: Heli Voice Safety

on:
  push:
    branches:
      - heli-dev
  pull_request:
    branches:
      - heli-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heli-voice:
    name: ASR, realtime, hot-swap memory regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Compile changed Python modules
        run: |
          python -m compileall -q main_logic/omni_realtime_client/_response_arbiter.py main_logic/omni_realtime_client/_responses.py main_logic/core/asr_runtime.py main_logic/asr_client/runtime.py main_logic/asr_client/transcript.py main_routers/debug_router.py tests/unit/test_heli_voice_stall_recovery.py
      - name: Install pinned project dependencies
        run: uv sync
      - name: Run Heli voice and memory isolation regression tests
        run: |
          uv run pytest -q tests/unit/test_heli_voice_stall_recovery.py tests/unit/test_asr_turn_abandon.py tests/unit/test_realtime_arbiter_native_path.py tests/unit/runtime/test_realtime_host_turn_identity.py tests/unit/test_gemini_hotswap_memory_race_patch081.py tests/unit/test_adaptive_context_window.py
