# 猫娘串门 · 海外 LiveKit 自建节点配置（单机，GCP 东京 e2-standard-4 起步）
#
# 说明与验收见同目录 README.md。键名对照 LiveKit 官方 config-sample.yaml：
#   https://github.com/livekit/livekit/blob/master/config-sample.yaml
#
# 本文件不放任何密钥：
#   - API key / secret 由 docker-compose.yml 经环境变量 LIVEKIT_KEYS 注入（取自 .env）；
#   - 下面所有 REPLACE_ME_* 都是占位，部署时换成真实域名 / 地址。

# 信令 / API（HTTP + WebSocket）。由 Caddy 在 443 上终结 TLS 后转进来；
# 云防火墙不要对外放行 7880（README「防火墙」）。
port: 7880

rtc:
  # ICE over TCP（UDP 不通、但 7881 放行的网络用）
  tcp_port: 7881
  # ICE over UDP 端口段（防火墙放行 UDP 50000-60000）
  port_range_start: 50000
  port_range_end: 60000
  # 通过 STUN 发现本机公网 IP（GCP 实例只有内网网卡）
  use_external_ip: true
  # 数据通道发送缓冲上限（字节）。超过后新的数据消息被丢弃，直到缓冲回落。
  # 串门每个发送方数据通道 ≤ 5 KB/s（VISIT_DATA_KBPS_MAX=40），1 MB 足够吸收重传突发，
  # 又不会让失控的客户端在 SFU 上无限堆积。
  # 注意：这个键在官方配置里位于 rtc 段，不是 limit 段。
  data_channel_max_buffered_amount: 1000000

room:
  # 房间只由 Servers 在 host 首次领凭证时 CreateRoom；拿着未过期 JWT 的客户端
  # 不能在 DeleteRoom 之后重新建房——服务端硬顶与配额都以此为前提（部署验收见 README）。
  auto_create: false
  # 每房 host + guest 各一，第三者进不来（Servers CreateRoom 也显式带 max_participants:2）
  max_participants: 2
  # 最后一个参与者离开后房间保留的秒数。默认 20 s 会在双方同时闪断时把房间回收，
  # auto_create:false 下就再也进不去；60 ≥ VISIT_PEER_REJOIN_GRACE_S(35) + 重连余量(25)。
  # Servers 的 CreateRoom 请求同样显式带 departure_timeout:60（上 LiveKit Cloud 时只能靠它）。
  departure_timeout: 60
  # 房间创建后一直没人进来时保留的秒数 = VISIT_INVITE_WAIT_S（邀请等待 10 min）；
  # Servers CreateRoom 时也会显式设置 empty_timeout。
  empty_timeout: 600

turn:
  enabled: true
  # TURN 用独立域名与证书；Caddy（caddy-l4）在 443 上按 SNI 把它分流到下面的 tls_port。
  domain: REPLACE_ME_TURN_DOMAIN
  # TLS 由 Caddy 终结，LiveKit 在 tls_port 上收到的是已解密的 TURN 流
  external_tls: true
  tls_port: 5349
  # TURN/UDP（防火墙放行 UDP 3478）
  udp_port: 3478

# 房间 / 参与者 / 轨道事件推给 Servers（track_published 查档位与轨数、participant_joined 写入房证据、
# room_finished 释放并发名额）。api_key 必须是 LIVEKIT_KEYS 里的那个 key；URL 由 Servers 定。
webhook:
  api_key: REPLACE_ME_LIVEKIT_API_KEY
  urls:
    - https://REPLACE_ME_SERVERS_HOST/REPLACE_ME_LIVEKIT_WEBHOOK_PATH

logging:
  level: info
