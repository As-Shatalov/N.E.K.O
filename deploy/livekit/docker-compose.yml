# 猫娘串门 · 海外 LiveKit 自建节点（单机：Caddy(caddy-l4) + livekit-server）
#
# 用法见 README.md。所有密钥 / 域名都来自同目录的 .env（不入库），本文件只引用变量：
#   LIVEKIT_DOMAIN       信令域名，例如 livekit.example.com
#   TURN_DOMAIN          TURN 独立域名，例如 turn.example.com
#   ACME_EMAIL           证书申请联系邮箱
#   LIVEKIT_API_KEY      与 Servers 共享的 API key（Servers 用它签 JWT、调 RoomService）
#   LIVEKIT_API_SECRET   对应 secret（只在本机 .env 与 Servers 密钥托管里出现）
#
# 两个服务都用 host 网络：LiveKit 需要直接收发 UDP 50000-60000 / 3478 与 TCP 7881。

services:
  caddy:
    # caddy-l4 不在官方 caddy 镜像里，用 xcaddy 现场构建（README「构建 caddy-l4」）
    build:
      context: .
      dockerfile_inline: |
        # 版本钉死（可复现构建）：Caddy 2.11.7 + caddy-l4 主干提交 42db569（2026-07-15）；升级时两处与 README 同步改，并先 caddy validate
        FROM caddy:2.11.7-builder AS builder
        RUN xcaddy build --with github.com/mholt/caddy-l4@42db5690dea199f930a6f08005fe2e4aab10dcc9
        FROM caddy:2.11.7
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    image: neko-visit/caddy-l4:local
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env}
      TURN_DOMAIN: ${TURN_DOMAIN:?set TURN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    # 版本按上线前压测通过的那一版钉死，升级前重跑 README 的验收清单
    image: livekit/livekit-server:v1.13.6
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # livekit-server 从 LIVEKIT_KEYS 读 "key: secret"，密钥不落进 livekit.yaml
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  caddy_data:
  caddy_config:
